[package]
name = "academic"
version = "0.3.0"
edition = "2021"
description = "Screenshot answer helper for Linux Hyprland"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.17"
thiserror = "2.0"
ureq = { version = "2.10", features = ["json"] }
url = "2.5"
